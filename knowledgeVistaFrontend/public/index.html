<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
   <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="LearnHub is a comprehensive e-learning platform for institutes to deliver video lessons, study materials, quizzes, and certifications. Designed to support interactive, self-paced learning, it empowers institutions to track student progress and offer high-quality education anytime, anywhere." />

    <!-- Load custom fonts from Google Fonts -->
<!-- <link href="https://fonts.googleapis.com/css2?family=Arial&family=Courier+New&family=Georgia&family=Roboto&family=Times+New+Roman&family=Verdana&display=swap" rel="stylesheet"> -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <script
      src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
      integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"
      integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"
      integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
      crossorigin="anonymous"
    ></script>
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- <title>Learn Hub</title> -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16676502340"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'AW-16676502340');
    </script>

<style id="theme-style">
   :root {
    --primary: #4680ff;  /* Default theme color */
    --lightprimary: #2066ff;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
  // Fetch backend config and store globally
  fetch("%PUBLIC_URL%/config.json")
    .then((response) => response.json())
    .then((config) => {
      window.baseUrl = config.REACT_APP_API_URL;

      // Now load theme-loader.js AFTER baseUrl is available
      var script = document.createElement("script");
      script.src = "%PUBLIC_URL%/theme-loader.js";
      document.head.appendChild(script);
    })
    .catch((error) => {
      console.error("❌ Failed to load config.json", error);
    });
</script>

  <!-- Load the CSP loader -->
    <script src="%PUBLIC_URL%/csp-loader.js"></script>

  </head>
  <body>
   <noscript>
  <strong>JavaScript is required to use this eLearning platform. Please enable it in your browser settings.</strong>
</noscript>

    <div id="root"></div>
